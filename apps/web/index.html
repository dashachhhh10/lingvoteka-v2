<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f8f2" />
    <meta
      name="description"
      content="Lingvoteka превращает материалы уроков итальянского в проверенные слова, карточки, грамматику и короткую практику."
    />
    <title>Lingvoteka — итальянский, который остаётся после урока</title>
    <script>
      try {
        const choice = localStorage.getItem('lingvoteka-theme');
        document.documentElement.dataset.theme =
          choice === 'light' || choice === 'dark'
            ? choice
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch (_) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
